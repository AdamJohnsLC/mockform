<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; img-src 'self' data:;">
  <meta name="description" content="Register for the mock test, choose your session and speaking time, and keep your place across test cycles." />
  <meta name="theme-color" content="#F7F5F0" />
  <title>Mock Test Registration</title>
  <link rel="preload" href="fonts/geist-variable.woff2" as="font" type="font/woff2" crossorigin>
  <script>
    (function() {
      try {
        var saved = localStorage.getItem('theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (saved === 'dark' || (!saved && prefersDark)) {
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <button id="theme-toggle-btn" class="theme-toggle-fab" type="button" aria-label="Toggle theme"></button>
  <div id="app">
    <header class="header">
      <div class="header-eyebrow">Candidate registration</div>
      <h1 class="header-title" id="app-title" onclick="onHeaderClick()">Register once. Stay informed for every test.</h1>
      <p id="header-subtitle" class="header-subtitle">Your registration follows the current test cycle — when a new test opens, your profile carries over and you pick a seat for the new date.</p>
    </header>
    <div id="cycle-status" class="cycle-status" role="status" aria-live="polite"></div>
    <main id="main">
      <div class="loading-screen" aria-busy="true">
        <div class="skeleton-row"><div><div class="skeleton-bar sk-name" style="width:56%"></div><div class="skeleton-bar sk-meta" style="width:34%"></div></div><div class="skeleton-bar sk-btn"></div></div>
        <div class="skeleton-row"><div><div class="skeleton-bar sk-name" style="width:46%"></div><div class="skeleton-bar sk-meta" style="width:28%"></div></div><div class="skeleton-bar sk-btn"></div></div>
        <div class="loading-text">Checking seat availability…</div>
      </div>
    </main>
    <footer class="site-footer">
      <span class="venue">Venue — 24th School Branch ·
        <a href="https://maps.app.goo.gl/TTibuZHDg4HzDf4E8" target="_blank" rel="noopener">Open map</a>
      </span>
      <a class="admin-link" href="#/admin">Admin console</a>
    </footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
