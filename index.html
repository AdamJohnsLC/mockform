<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self'; img-src 'self' data:;">
  <title>Mock Test Registration</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  
</head>
<body>
  <div id="app">
    <div class="header">
      <div class="header-eyebrow">2026 Admission Prep</div>
      <div class="header-title" onclick="onHeaderClick()" style="cursor:default;user-select:none">Mock Test Registration</div>
      <div class="header-subtitle">Select a session and complete your details below</div>
    </div>
    <div id="main">
      <div class="loading-screen">
        <div class="loading-dots">
          <div class="loading-dot"></div><div class="loading-dot"></div><div class="loading-dot"></div>
        </div>
        <div class="loading-text">Loading seat availability…</div>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
  
</body>
</html>
