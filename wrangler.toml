name = "mockform"
compatibility_date = "2026-04-15"
main = "worker.js"

[assets]
directory = "./"

[[kv_namespaces]]
binding = "MOCK_DB"
id = "b50116de23d643fb81b0e1ba27de8923"

[triggers]
# Hourly cron — the schedule list in Settings (`bot_schedules`) decides
# which reminder entries fire at any given hour. Also resumes in-flight
# broadcasts left over from a Worker timeout.
crons = ["0 * * * *"]
[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1